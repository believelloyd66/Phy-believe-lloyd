<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b172a">
  <title>Create Account | PHY EDU CONNECT</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:25px;color:white;background:radial-gradient(circle at top left,#174b82,transparent 45%),linear-gradient(135deg,#06101f,#102b4b,#071426)}
    .signup-container{width:100%;max-width:470px;padding:35px;border:1px solid rgba(255,255,255,.2);border-radius:22px;background:rgba(255,255,255,.09);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 15px 45px rgba(0,0,0,.35)}
    .heading{text-align:center;margin-bottom:25px}.heading h1{font-size:28px;margin-bottom:9px}.heading p{color:#c3d5e9;font-size:14px}
    .form-group{margin-bottom:16px}label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}
    input{width:100%;padding:14px;border:1px solid rgba(255,255,255,.2);border-radius:10px;outline:none;color:white;background:rgba(5,20,40,.55);font-size:14px}
    input::placeholder{color:#a9bbcf}input:focus{border-color:#64b5ff;box-shadow:0 0 0 2px rgba(100,181,255,.15)}
    button{width:100%;padding:15px;border:none;border-radius:10px;background:linear-gradient(135deg,#1687e8,#0756a5);color:white;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px}
    button:disabled{opacity:.6;cursor:not-allowed}
    .footer{text-align:center;margin-top:22px;color:#bdcde0;font-size:13px}.footer a{color:#72c0ff;text-decoration:none}
    .notice{margin-top:15px;font-size:12px;color:#b9cde3;text-align:center;line-height:1.5}
    .message{display:none;margin:14px 0;padding:11px;border-radius:9px;font-size:13px;line-height:1.5}
    .message.show{display:block}.message.error{background:#8b252544;color:#ffd6d6}.message.success{background:#176b4544;color:#caffdf}
    @media(max-width:480px){.signup-container{padding:25px 20px}}
  </style>
</head>
<body>
  <main class="signup-container">
    <header class="heading">
      <h1>Create Account</h1>
      <p>Join the PHY EDU CONNECT community.</p>
    </header>
    <form id="signupForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" autocomplete="name" maxlength="100" required>
      </div>
      <div class="form-group">
        <label for="matricNumber">Matriculation Number</label>
        <input type="text" id="matricNumber" name="matricNumber" placeholder="Enter your matric number" maxlength="40" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" autocomplete="tel" maxlength="30" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password (at least 8 characters)" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" minlength="8" required>
      </div>
      <div id="signupMessage" class="message" role="alert"></div>
      <button type="submit" id="submitButton">Create Account</button>
      <p class="notice">Your password is handled securely by Firebase Authentication. It is not saved in your profile document.</p>
    </form>
    <footer class="footer">
      Already have an account? <a href="login.html">Log In</a>
      <p style="margin-top:20px;">© 2026 PHY EDU CONNECT.<br>Designed &amp; Developed by Believe Lloyd.</p>
    </footer>
  </main>
  <script type="module" src="signup.js"></script>
</body>
</html>
